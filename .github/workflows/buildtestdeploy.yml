
name: Build, test, deploy

on:
  push:
    branches: [ "main", "aronexperimenting", "aron" ]
  pull_request:
    branches: [ "main", "aronexperimenting", "aron" ]

jobs:
  buildTestBackend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal

  buildFrontend:
    runs-on: ubuntu-latest
    defaults:
      run:
       working-directory: ./CoMove

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: CoMove/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        
  buildDeploy:
    runs-on: ubuntu-latest
    needs: [buildFrontend, buildTestBackend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Backend
        run: dotnet publish backend/backend -c Release -o ./publish

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: CoMove/package-lock.json

      - name: Install Node.js dependencies
        run: npm ci
        working-directory: CoMove

      - name: Build Frontend
        run: npm run build
        working-directory: CoMove

      - name: Copy backend to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          source: './publish/*'
          target: '/opt/comove-backend'
          strip_components: 1

      - name: Copy frontend to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          source: 'CoMove/dist/*'
          target: '/var/www/comove-frontend'
          strip_components: 2

      - name: Restart backend service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: sudo systemctl restart comove-backend
